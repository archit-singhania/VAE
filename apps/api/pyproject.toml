[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aevra-api"
version = "0.1.0"
description = "VAE's deterministic API and policy boundary"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "beautifulsoup4>=4.13,<5",
  "celery[redis]>=5.6,<6",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "huggingface-hub>=0.35,<2",
  "Pillow>=11,<13",
  "langgraph>=1.0,<2",
  "markdown-it-py>=4,<5",
  "minio>=7.2,<8",
  "pgvector>=0.4,<1",
  "pwdlib[argon2]>=0.2,<1",
  "pyjwt>=2.10,<3",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "pypdf>=6.1,<7",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0.43,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
  "reportlab>=4.4,<5",
]

# The API image intentionally installs the application package and the shared
# worker/service namespace from the repository root. Explicit discovery avoids
# setuptools' flat-layout ambiguity when both top-level namespaces are copied
# into the Docker build context.
[tool.setuptools.packages.find]
where = ["."]
include = ["aevra_api*", "services*"]
namespaces = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
