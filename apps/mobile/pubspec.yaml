name: aevra_mobile
description: VAE's free, server-driven mobile workspace.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  http_parser: ^4.1.2
  file_picker: ^10.3.10
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  # Open-source local playback; no hosted video service or paid provider.
  video_player: ^2.9.2
  lucide_icons_flutter: ^3.1.20
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Native iOS icon and splash generators; the iOS project and brand PNGs
  # are included in this checkout.
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.3
flutter:
  uses-material-design: true
  shaders:
    - shaders/background.frag
  assets:
    - assets/branding/
    - assets/video/
    - assets/fonts/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Medium.ttf
          weight: 500
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/aevra_app_icon_1024.png"
  min_sdk_android: 21
  # The adaptive foreground must be transparent with generous padding — Android
  # crops it to a circle/squircle. Pointing it at the opaque square icon would
  # get the mark clipped, so it has its own asset.
  adaptive_icon_background: "#171014"
  adaptive_icon_foreground: "assets/branding/aevra_icon_foreground_1024.png"
  remove_alpha_ios: true
  web:
    generate: false

flutter_native_splash:
  color: "#F8F3F4"
  image: "assets/branding/aevra_splash_600.png"
  color_dark: "#171014"
  image_dark: "assets/branding/aevra_splash_600.png"
  # Android 12+ masks the splash image to a circle and only the inner two
  # thirds survives, so it gets its own smaller-on-a-bigger-canvas asset.
  android_12:
    color: "#F8F3F4"
    image: "assets/branding/aevra_splash_android12_960.png"
    color_dark: "#171014"
    image_dark: "assets/branding/aevra_splash_android12_960.png"
